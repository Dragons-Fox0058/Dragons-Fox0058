name: Update profile metrics

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: Dragons-Fox0058
          filename: github-metrics.svg
          base: header, activity, community, repositories
          config_order: base.header, base.activity, base.community, base.repositories, isocalendar, languages, habits, achievements
          config_timezone: Europe/Istanbul
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_achievements: yes
          plugin_achievements_display: compact
          output_action: commit
          committer_message: "chore: refresh profile metrics [skip ci]"
          retries: 3
