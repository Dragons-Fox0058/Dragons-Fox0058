name: Update profile metrics

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate profile overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: Dragons-Fox0058
          filename: github-metrics.svg
          base: header, activity, community, repositories
          config_timezone: Europe/Istanbul
          output_action: commit
          committer_message: "chore: refresh profile metrics [skip ci]"
          retries: 3

      - name: Generate language statistics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: Dragons-Fox0058
          filename: metrics-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          output_action: commit
          committer_message: "chore: refresh language metrics [skip ci]"
          retries: 3

      - name: Generate contribution activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: Dragons-Fox0058
          filename: metrics-activity.svg
          base: ""
          plugin_isocalendar: yes
          plugin_habits: yes
          plugin_habits_charts: yes
          output_action: commit
          committer_message: "chore: refresh activity metrics [skip ci]"
          retries: 3

      - name: Generate achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: Dragons-Fox0058
          filename: metrics-achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          output_action: commit
          committer_message: "chore: refresh achievement metrics [skip ci]"
          retries: 3
